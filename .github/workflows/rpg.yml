name: Update RPG Card

on:
  schedule:
    - cron: "0 0 * * *" # каждый день в 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python rpg.py -u ${{ github.repository_owner }} -o profile-card.svg

      - name: Commit if changed
        run: |
          git config user.name "rpg-bot"
          git config user.email "rpg-bot@users.noreply.github.com"
          git add profile-card.svg
          git commit -m "chore: update RPG card" || exit 0
          git push
